<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="KevinK — the personal site of Kevin Kim. Projects, experiments, and things built out of curiosity."
    />
    <title>Personal Site</title>

    <!--
      Critical CSS, inlined so the first paint is already the dark theme
      instead of a white flash while the bundled stylesheet is in flight.
      Mirrors the html/body rules in src/index.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!--
      Loaded off the critical path: `media="print"` keeps the browser from
      treating these as render-blocking, and the onload handler promotes them
      to `all` once they arrive. Both webfont stacks are decorative — the
      fallbacks above render immediately and `display=swap` swaps them in.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Anton+SC&amp;display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Anton+SC&amp;display=swap"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-app.tsx"></script>
  </body>
</html>
